<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture diagram of Marketo Optimizer and Marketo Engage services</title>
<desc>Shows Marketo Optimizer and Marketo Engage triggering services hosted across Microsoft Azure and AWS, including Journey and Campaign runtimes, and their connected data stores including Snowflake, Apache SOLR, and a shared Aurora instance.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box{fill:#FFFFFF;stroke:#B4B2A9}
.jo-fill{fill:#14B8A5}
.jo-stroke{stroke:#0D8C7D}
.mk-fill{fill:#4B3F91}
.mk-stroke{stroke:#362B6E}
.on-color{fill:#FFFFFF}
.arr{stroke:#5F5E5A}
</style>

<rect x="0" y="0" width="680" height="540" fill="#FFFFFF"/>

<!-- Containers -->
<g><rect class="box" x="40" y="90" width="150" height="410" rx="20" stroke-width="0.5"/></g>
<text class="th" x="50" y="112">Microsoft Azure</text>
<g><rect class="box" x="210" y="90" width="430" height="410" rx="20" stroke-width="0.5"/></g>
<text class="th" x="225" y="112">Amazon Web Services</text>

<!-- Triggers -->
<g>
<rect class="jo-fill jo-stroke" x="90" y="20" width="260" height="44" rx="8" stroke-width="0.5"/>
<text class="th on-color" x="220" y="42" text-anchor="middle" dominant-baseline="central">Marketo Optimizer</text>
</g>
<g>
<rect class="mk-fill mk-stroke" x="440" y="20" width="170" height="44" rx="8" stroke-width="0.5"/>
<text class="th on-color" x="525" y="42" text-anchor="middle" dominant-baseline="central">Marketo Engage</text>
</g>

<!-- Azure contents -->
<g>
<rect class="jo-fill jo-stroke" x="50" y="135" width="130" height="70" rx="10" stroke-width="0.5"/>
<text class="th on-color" x="115" y="158" text-anchor="middle" dominant-baseline="central">CJA</text>
<text class="ts on-color" x="115" y="182" text-anchor="middle" dominant-baseline="central">Built-in reports</text>
</g>
<g>
<rect class="jo-fill jo-stroke" x="50" y="390" width="130" height="50" rx="10" stroke-width="0.5"/>
<text class="th on-color" x="115" y="415" text-anchor="middle" dominant-baseline="central">AEP datasets</text>
</g>

<!-- AWS: Marketo Optimizer services -->
<rect class="jo-fill jo-stroke" x="210" y="135" width="210" height="120" rx="12" stroke-width="0.5"/>
<text class="th on-color" x="315" y="155" text-anchor="middle" dominant-baseline="central">Marketo Optimizer</text>
<text class="th on-color" x="315" y="177" text-anchor="middle" dominant-baseline="central">services</text>
<g>
<rect class="box" x="228" y="200" width="174" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="315" y="220" text-anchor="middle" dominant-baseline="central">Journey runtime</text>
</g>

<!-- AWS: Marketo Engage services -->
<rect class="mk-fill mk-stroke" x="445" y="135" width="180" height="120" rx="12" stroke-width="0.5"/>
<text class="th on-color" x="535" y="155" text-anchor="middle" dominant-baseline="central">Marketo Engage</text>
<text class="th on-color" x="535" y="177" text-anchor="middle" dominant-baseline="central">services</text>
<g>
<rect class="box" x="463" y="200" width="144" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="535" y="220" text-anchor="middle" dominant-baseline="central">Campaign runtime</text>
</g>

<!-- Databases row -->
<g>
<rect class="jo-fill jo-stroke" x="245" y="300" width="140" height="50" rx="10" stroke-width="0.5"/>
<text class="th on-color" x="315" y="325" text-anchor="middle" dominant-baseline="central">Snowflake</text>
</g>
<g>
<rect class="mk-fill mk-stroke" x="460" y="300" width="150" height="50" rx="10" stroke-width="0.5"/>
<text class="th on-color" x="535" y="325" text-anchor="middle" dominant-baseline="central">Apache SOLR</text>
</g>

<!-- Shared Aurora instance (centered within the AWS box) -->
<rect x="255" y="370" width="340" height="110" rx="14" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="425" y="390" text-anchor="middle">Shared Aurora instance</text>
<g>
<rect class="jo-fill jo-stroke" x="270" y="405" width="150" height="50" rx="8" stroke-width="0.5"/>
<text class="ts on-color" x="345" y="430" text-anchor="middle" dominant-baseline="central">Aurora Optimizer</text>
</g>
<g>
<rect class="mk-fill mk-stroke" x="425" y="405" width="150" height="50" rx="8" stroke-width="0.5"/>
<text class="ts on-color" x="500" y="430" text-anchor="middle" dominant-baseline="central">Aurora Marketo</text>
</g>

<!-- Arrows -->
<line x1="150" y1="64" x2="118" y2="133" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="64" x2="315" y2="133" class="arr" marker-end="url(#arrow)"/>
<line x1="525" y1="64" x2="535" y2="133" class="arr" marker-end="url(#arrow)"/>
<line x1="115" y1="205" x2="115" y2="388" class="arr" marker-end="url(#arrow)"/>
<line x1="315" y1="240" x2="315" y2="298" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="240" x2="535" y2="298" class="arr" marker-end="url(#arrow)"/>
<line x1="402" y1="220" x2="463" y2="220" stroke="#5F5E5A" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="425" y1="430" x2="420" y2="430" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Services to Shared Aurora instance -->
<polyline points="315,240 315,250 400,250 400,365 345,365 345,403" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<polyline points="535,240 535,250 615,250 615,365 500,365 500,403" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Marketo Optimizer services to AEP datasets -->
<polyline points="228,220 200,220 200,415 182,415" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
</svg>
